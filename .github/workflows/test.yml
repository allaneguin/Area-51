name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Node 24 e obrigatorio: o backend usa `node:sqlite`, que so existe a
      # partir do 22.5. Em versao anterior o `npm test` nem carrega.
      - run: npm ci
      - run: npm test
