  Este arquivo se chamou redesign-organic.dc.html ate 26/08 -- era um export de
  canvas do Claude Design (974 KB, React do unpkg, artboards estaticas) que em
  24/08 virou o shell de verdade. Voltou a se chamar app.html quando a Supabase
  saiu e nao havia mais link antigo a preservar.

  O endereco /c aponta para ca (rota em server/index.js): e o que os links de
  inquilino usam.
-->

  <!-- Content-Security-Policy: backstop contra exfiltração em caso de XSS.
       Com a saída da Supabase (26/08) esta diretiva ficou mais curta e mais
       forte: `script-src` não tem mais CDN externo — todo script é do próprio
       site — e `connect-src` não tem mais host de terceiro guardando dado.
       Sobraram três domínios, todos de leitura e nenhum recebendo dado nosso:
       ipify/ipapi (IP da trilha de aceite, o segundo é reserva do primeiro) e
       viacep (busca de CEP). Ver R5.5.
       `unsafe-inline` continua por causa dos ~85 handlers onclick; é dívida
       conhecida, não descuido.
       Sem frame-ancestors: o navegador ignora essa diretiva quando ela vem por
       <meta> (só vale como cabeçalho). Quem barra clickjacking é o
       X-Frame-Options que o server/index.js envia. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.ipify.org https://ipapi.co https://viacep.com.br; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>MEUS IMÓVEIS APP</title>
  <script>
    // Aplica o tema ANTES da pintura para nao piscar branco ao carregar.
    // Preferencia salva vence; sem ela, segue o tema do sistema operacional.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* localStorage bloqueado: segue no tema claro */ }

      // Link do inquilino (#tenant): esconde a interface do locador ANTES da
      // primeira pintura. Sem isto a sidebar/menu do app piscam enquanto o JS
      // carrega e troca para a tela do inquilino.
      if ((location.hash || '').indexOf('#tenant') === 0) {
        document.documentElement.classList.add('is-tenant-boot');
      }
    })();
  </script>
