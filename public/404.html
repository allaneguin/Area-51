<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meus Imóveis</title>
  <script>
    // Fallback de SPA no GitHub Pages: encaminha rotas desconhecidas para o app.html
    var p = window.location.pathname;
    var repo = '/Area-51';
    var clean = p.startsWith(repo) ? p.substring(repo.length) : p;
    if (clean === '/c' || clean === '/c/') {
      window.location.replace((p.startsWith(repo) ? repo : '') + '/app.html' + window.location.search + window.location.hash);
    } else {
      window.location.replace((p.startsWith(repo) ? repo : '') + '/app.html' + window.location.hash);
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 2rem;">Carregando Meus Imóveis...</p>
</body>
</html>
